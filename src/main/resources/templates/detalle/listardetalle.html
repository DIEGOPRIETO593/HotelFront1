<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
<meta charset="UTF-8">
<title>Detalle de Servicios por Estadía</title>
</head>
<body>

	<div layout:fragment="contenidopaginas">
		<div class="container-fluid py-2">

			<div th:if="${message != null}"
				th:classappend="${'alert-' + message.type}"
				class="alert shadow-sm alert-dismissible fade show d-flex align-items-center"
				role="alert">
				<i class="fas me-2 fs-5"
					th:classappend="${message.type == 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i>
				<div th:text="${message.text}">Texto del mensaje</div>
				
				</div>
			</div>

			<div class="card shadow-sm border-0 rounded-4">
				<div class="card-body p-0">
					<div class="table-responsive">
						<table class="table table-hover align-middle mb-0">
							<thead class="table-light">
								<tr>
									<th class="ps-4 text-secondary fw-semibold border-bottom-0 py-3 rounded-top-start" style="width: 80px;">ID</th>
									<th class="text-secondary fw-semibold border-bottom-0 py-3">Huésped</th>
									<th class="text-secondary fw-semibold border-bottom-0 py-3">Habitación</th>
									<th class="text-secondary fw-semibold border-bottom-0 py-3">Servicio</th>
									<th class="text-secondary fw-semibold border-bottom-0 py-3">Cantidad</th>
									<th class="text-secondary fw-semibold border-bottom-0 py-3">Total</th>
									
								</tr>
							</thead>
							<tbody class="border-top-0">
								<tr th:each="d : ${detalles}">
									<td class="ps-4"><span class="badge bg-secondary rounded-pill shadow-sm" th:text="'#' + ${d.idDetalle}">#1</span></td>
									<td class="fw-medium" th:text="${d.nombreHuesped}">Juan Perez</td>
									<td th:text="${d.numeroHabitacion}">101</td>
									<td th:text="${d.nombreServicio}">Spa</td>
									<td th:text="${d.cantidad}">1</td>
									<td th:text="'$' + ${d.total}">$0.00</td>
									</tr>
								<tr th:if="${#lists.isEmpty(detalles)}">
									<td colspan="6" class="text-center py-5 text-secondary">
										<i class="fas fa-inbox fa-3x d-block mb-3 opacity-50"></i>
										<p class="fs-5 fw-medium mb-1">No hay consumos registrados</p>
										<p class="small mb-0">Comienza asignando un consumo de servicio a una estadía.</p>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>

			

		</div>
	</div>

</body>
</html>
